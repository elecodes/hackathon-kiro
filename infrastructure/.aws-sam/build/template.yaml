AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KiroSpec Studio - Agent 2 Lambda + API Gateway + DynamoDB
Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 30
    Architectures:
    - arm64
    Environment:
      Variables:
        NODE_ENV: production
        SPECS_TABLE:
          Ref: SpecsTable
Resources:
  SpecsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kirospec-specs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  KiroSpecApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: KiroSpec Studio API
      Cors:
        AllowMethods: '''POST,GET,OPTIONS'''
        AllowHeaders: '''Content-Type'''
        AllowOrigin: '''*'''
  Agent2Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: Agent2Function
      Description: Agent 2 - Software Architect spec generator
      Events:
        GenerateSpec:
          Type: Api
          Properties:
            Path: /generate-spec
            Method: POST
            RestApiId:
              Ref: KiroSpecApi
        GetSpec:
          Type: Api
          Properties:
            Path: /specs/{specId}
            Method: GET
            RestApiId:
              Ref: KiroSpecApi
      Policies:
      - CloudWatchLogsFullAccess
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SpecsTable
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: KiroSpecEventBus
    Metadata:
      SamResourceId: Agent2Function
  KiroSpecEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: kirospec-pipeline
  Agent2CompletedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName:
        Ref: KiroSpecEventBus
      EventPattern:
        source:
        - kirospec.agent2
        detail-type:
        - SpecGenerated
      Targets:
      - Id: LogAgent2Events
        Arn:
          Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/events/kirospec-agent2-completed
  Agent2EventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/events/kirospec-agent2-completed
      RetentionInDays: 7
  KiroSpecDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: kirospec-studio
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"metric\",\n      \"\
          x\": 0, \"y\": 0, \"width\": 12, \"height\": 6,\n      \"properties\": {\n\
          \        \"title\": \"Pipeline Executions\",\n        \"metrics\": [\n \
          \         [\"AWS/States\", \"ExecutionsStarted\", \"StateMachineArn\", \"\
          ${KiroSpecPipeline}\"],\n          [\"AWS/States\", \"ExecutionsSucceeded\"\
          , \"StateMachineArn\", \"${KiroSpecPipeline}\"],\n          [\"AWS/States\"\
          , \"ExecutionsFailed\", \"StateMachineArn\", \"${KiroSpecPipeline}\"]\n\
          \        ],\n        \"region\": \"${AWS::Region}\",\n        \"period\"\
          : 300\n      }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\"\
          : 12, \"y\": 0, \"width\": 12, \"height\": 6,\n      \"properties\": {\n\
          \        \"title\": \"Agent 2 Lambda\",\n        \"metrics\": [\n      \
          \    [\"AWS/Lambda\", \"Invocations\", \"FunctionName\", \"${Agent2Function}\"\
          ],\n          [\"AWS/Lambda\", \"Errors\", \"FunctionName\", \"${Agent2Function}\"\
          ],\n          [\"AWS/Lambda\", \"Duration\", \"FunctionName\", \"${Agent2Function}\"\
          ]\n        ],\n        \"region\": \"${AWS::Region}\",\n        \"period\"\
          : 300\n      }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\"\
          : 0, \"y\": 6, \"width\": 12, \"height\": 6,\n      \"properties\": {\n\
          \        \"title\": \"API Gateway\",\n        \"metrics\": [\n         \
          \ [\"AWS/ApiGateway\", \"Count\", \"ApiName\", \"kirospec-studio\"],\n \
          \         [\"AWS/ApiGateway\", \"4XXError\", \"ApiName\", \"kirospec-studio\"\
          ],\n          [\"AWS/ApiGateway\", \"5XXError\", \"ApiName\", \"kirospec-studio\"\
          ],\n          [\"AWS/ApiGateway\", \"Latency\", \"ApiName\", \"kirospec-studio\"\
          ]\n        ],\n        \"region\": \"${AWS::Region}\",\n        \"period\"\
          : 300\n      }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\"\
          : 12, \"y\": 6, \"width\": 12, \"height\": 6,\n      \"properties\": {\n\
          \        \"title\": \"DynamoDB\",\n        \"metrics\": [\n          [\"\
          AWS/DynamoDB\", \"ConsumedReadCapacityUnits\", \"TableName\", \"kirospec-specs\"\
          ],\n          [\"AWS/DynamoDB\", \"ConsumedWriteCapacityUnits\", \"TableName\"\
          , \"kirospec-specs\"]\n        ],\n        \"region\": \"${AWS::Region}\"\
          ,\n        \"period\": 300\n      }\n    }\n  ]\n}\n"
  PipelineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kirospec-pipeline-failures
      AlarmDescription: Triggers when the pipeline fails
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
      - Name: StateMachineArn
        Value:
          Ref: KiroSpecPipeline
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
  Agent2ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kirospec-agent2-errors
      AlarmDescription: Triggers when Agent 2 Lambda has errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: Agent2Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertsTopic
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kirospec-alerts
      DisplayName: KiroSpec Studio Alerts
  Agent1Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: Agent1Function
      Description: Agent 1 - PM & Market Strategist (placeholder)
    Metadata:
      SamResourceId: Agent1Function
  Agent3Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: Agent3Function
      Description: Agent 3 - Legal & Compliance (placeholder)
    Metadata:
      SamResourceId: Agent3Function
  Agent4Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: Agent4Function
      Description: Agent 4 - DevSecOps & Automation (placeholder)
    Metadata:
      SamResourceId: Agent4Function
  KiroSpecPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: kirospec-pipeline
      DefinitionUri: ../../statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        Agent1FunctionArn:
          Fn::GetAtt:
          - Agent1Function
          - Arn
        Agent2FunctionArn:
          Fn::GetAtt:
          - Agent2Function
          - Arn
        Agent3FunctionArn:
          Fn::GetAtt:
          - Agent3Function
          - Arn
        Agent4FunctionArn:
          Fn::GetAtt:
          - Agent4Function
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: Agent1Function
      - LambdaInvokePolicy:
          FunctionName:
            Ref: Agent2Function
      - LambdaInvokePolicy:
          FunctionName:
            Ref: Agent3Function
      - LambdaInvokePolicy:
          FunctionName:
            Ref: Agent4Function
      Events:
        ApiTrigger:
          Type: Api
          Properties:
            Path: /run-pipeline
            Method: POST
            RestApiId:
              Ref: KiroSpecApi
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${KiroSpecApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  Agent2FunctionArn:
    Description: Agent 2 Lambda function ARN
    Value:
      Fn::GetAtt:
      - Agent2Function
      - Arn
  SpecsTableName:
    Description: DynamoDB table name
    Value:
      Ref: SpecsTable
  EventBusName:
    Description: EventBridge bus for inter-agent communication
    Value:
      Ref: KiroSpecEventBus
  PipelineStateMachineArn:
    Description: Step Functions state machine ARN
    Value:
      Ref: KiroSpecPipeline
  AlertsTopicArn:
    Description: SNS topic for alerts (subscribe your email to receive notifications)
    Value:
      Ref: AlertsTopic
