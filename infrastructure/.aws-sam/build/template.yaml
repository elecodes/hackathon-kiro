AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KiroSpec Studio - Agent 2 Lambda + API Gateway + DynamoDB
Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 30
    Architectures:
    - arm64
    Environment:
      Variables:
        NODE_ENV: production
        SPECS_TABLE:
          Ref: SpecsTable
Resources:
  SpecsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kirospec-specs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  KiroSpecApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: KiroSpec Studio API
      Cors:
        AllowMethods: '''POST,GET,OPTIONS'''
        AllowHeaders: '''Content-Type'''
        AllowOrigin: '''*'''
  Agent2Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: Agent2Function
      Description: Agent 2 - Software Architect spec generator
      Events:
        GenerateSpec:
          Type: Api
          Properties:
            Path: /generate-spec
            Method: POST
            RestApiId:
              Ref: KiroSpecApi
        GetSpec:
          Type: Api
          Properties:
            Path: /specs/{specId}
            Method: GET
            RestApiId:
              Ref: KiroSpecApi
      Policies:
      - CloudWatchLogsFullAccess
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SpecsTable
    Metadata:
      SamResourceId: Agent2Function
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${KiroSpecApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  Agent2FunctionArn:
    Description: Agent 2 Lambda function ARN
    Value:
      Fn::GetAtt:
      - Agent2Function
      - Arn
  SpecsTableName:
    Description: DynamoDB table name
    Value:
      Ref: SpecsTable
