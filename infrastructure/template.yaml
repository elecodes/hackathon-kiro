AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: KiroSpec Studio - Agent 2 Lambda + API Gateway + DynamoDB

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 30
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_ENV: production
        SPECS_TABLE: !Ref SpecsTable

Resources:
  # DynamoDB Table for persisting generated specs
  SpecsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kirospec-specs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # API Gateway (REST)
  KiroSpecApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: KiroSpec Studio API
      Cors:
        AllowMethods: "'POST,GET,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # Agent 2 Lambda Function
  Agent2Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: lambda/agent2/
      Description: Agent 2 - Software Architect spec generator
      Events:
        GenerateSpec:
          Type: Api
          Properties:
            Path: /generate-spec
            Method: POST
            RestApiId: !Ref KiroSpecApi
        GetSpec:
          Type: Api
          Properties:
            Path: /specs/{specId}
            Method: GET
            RestApiId: !Ref KiroSpecApi
      Policies:
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref SpecsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref KiroSpecEventBus

  # EventBridge Bus for inter-agent communication
  KiroSpecEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: kirospec-pipeline

  # Rule: When Agent 2 completes, log to CloudWatch (placeholder for Agent 3 trigger)
  Agent2CompletedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref KiroSpecEventBus
      EventPattern:
        source:
          - "kirospec.agent2"
        detail-type:
          - "SpecGenerated"
      Targets:
        - Id: LogAgent2Events
          Arn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/events/kirospec-agent2-completed"

  # CloudWatch Log Group for EventBridge events
  Agent2EventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/events/kirospec-agent2-completed
      RetentionInDays: 7

  # CloudWatch Dashboard
  KiroSpecDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: kirospec-studio
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Pipeline Executions",
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${KiroSpecPipeline}"],
                  ["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${KiroSpecPipeline}"],
                  ["AWS/States", "ExecutionsFailed", "StateMachineArn", "${KiroSpecPipeline}"]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Agent 2 Lambda",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${Agent2Function}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${Agent2Function}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${Agent2Function}"]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "kirospec-studio"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "kirospec-studio"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "kirospec-studio"],
                  ["AWS/ApiGateway", "Latency", "ApiName", "kirospec-studio"]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "kirospec-specs"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "kirospec-specs"]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            }
          ]
        }

  # Alarm: Pipeline failures
  PipelineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kirospec-pipeline-failures
      AlarmDescription: Triggers when the pipeline fails
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref KiroSpecPipeline
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # Alarm: Agent 2 Lambda errors
  Agent2ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kirospec-agent2-errors
      AlarmDescription: Triggers when Agent 2 Lambda has errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Agent2Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # SNS Topic for pipeline notifications
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kirospec-alerts
      DisplayName: KiroSpec Studio Alerts

  # Agent 1 Placeholder Lambda
  Agent1Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: lambda/agent1-placeholder/
      Description: Agent 1 - PM & Market Strategist (placeholder)

  # Agent 3 Placeholder Lambda
  Agent3Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: lambda/agent3-placeholder/
      Description: Agent 3 - Legal & Compliance (placeholder)

  # Agent 4 Placeholder Lambda
  Agent4Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: lambda/agent4-placeholder/
      Description: Agent 4 - DevSecOps & Automation (placeholder)

  # Step Functions State Machine — orchestrates all 4 agents
  KiroSpecPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: kirospec-pipeline
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        Agent1FunctionArn: !GetAtt Agent1Function.Arn
        Agent2FunctionArn: !GetAtt Agent2Function.Arn
        Agent3FunctionArn: !GetAtt Agent3Function.Arn
        Agent4FunctionArn: !GetAtt Agent4Function.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref Agent1Function
        - LambdaInvokePolicy:
            FunctionName: !Ref Agent2Function
        - LambdaInvokePolicy:
            FunctionName: !Ref Agent3Function
        - LambdaInvokePolicy:
            FunctionName: !Ref Agent4Function
      Events:
        ApiTrigger:
          Type: Api
          Properties:
            Path: /run-pipeline
            Method: POST
            RestApiId: !Ref KiroSpecApi

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${KiroSpecApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  Agent2FunctionArn:
    Description: Agent 2 Lambda function ARN
    Value: !GetAtt Agent2Function.Arn
  SpecsTableName:
    Description: DynamoDB table name
    Value: !Ref SpecsTable
  EventBusName:
    Description: EventBridge bus for inter-agent communication
    Value: !Ref KiroSpecEventBus
  PipelineStateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref KiroSpecPipeline
  AlertsTopicArn:
    Description: SNS topic for alerts (subscribe your email to receive notifications)
    Value: !Ref AlertsTopic
